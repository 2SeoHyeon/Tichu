services:
  - type: web
    name: tichu
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: tichu-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: tichu-db
    plan: free
    databaseName: tichu
    user: tichu
